<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="marker">
        <h2>Select color</h2>
        <div id="selectedColor" class="color1"></div>
        <h3>Percent of ink:
            <input type="text" class="ink" id="inkPercent">
            %
        </h3>
        <table id="table">
            <tr id="tr1">
                <th><input type="range" min="0" step="1" max="255" id="th1"></th>
                <th><input type="range" min="0" step="1" max="255" id="th2"></th>
                <th><input type="range" min="0" step="1" max="255" id="th3"></th>
            </tr>
            <br>
            <tr id="tr2">
                <th><input type="number" min="0" step="1" max="255"></th>
                <th><input type="number" min="0" step="1" max="255"></th>
                <th><input type="number" min="0" step="1" max="255"></th>
            </tr>
        </table>
        <p>Enter text</p>
        <input type="text" id="inputText">
        <button id="buttonPrint">Print</button>
        <button id="buttonClear">Clear</button>
        <button id="buttonRefill">Refill</button>
        <div id="printText"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
